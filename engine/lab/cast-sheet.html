<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Cast sheet</title>
<!-- Model sheets for the cast, in the style of docs/characters/*_ref.png (warm studio, turnarounds, gestures, faces).
     Render: node engine/lab/render-lab.js <outDir> --page cast-sheet.html  (one shot per character + a lineup) -->
<style>
@font-face{font-family:IN;font-weight:900;src:url('../../node_modules/@fontsource/inter/files/inter-latin-900-normal.woff2')}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#f3e2d2;font-family:IN,sans-serif}
#c{position:fixed;inset:0;width:1080px;height:1920px}
#t{position:fixed;left:40px;top:30px;font-weight:900;font-size:76px;color:#2a1d16}
#s{position:fixed;left:42px;top:120px;font-weight:900;font-size:26px;color:#6b5547}
.l{position:fixed;font-weight:900;font-size:22px;color:#3a2a20;text-align:center;width:200px}
</style></head><body>
<canvas id="c"></canvas><div id="t"></div><div id="s"></div><div id="labels"></div>
<script src="../../node_modules/three/build/three.min.js"></script>
<script src="../../node_modules/three/examples/js/environments/RoomEnvironment.js"></script>
<script src="../characters.js"></script>
<script>
const W = 1080, H = 1920;
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true, alpha: false });
renderer.setPixelRatio(1); renderer.setSize(W, H, false); renderer.autoClear = false;
renderer.outputEncoding = THREE.sRGBEncoding; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const env = new THREE.PMREMGenerator(renderer).fromScene(new THREE.RoomEnvironment(), .04).texture;
const BG = new THREE.Color(0xf3e2d2).convertSRGBToLinear();

function studio() { // warm cream studio: soft key from upper left, warm bounce, shadow catcher
  const sc = new THREE.Scene(); sc.background = BG;
  const key = new THREE.DirectionalLight(0xfff1e0, 1.6); key.position.set(-4, 7, 5); key.castShadow = true;
  key.shadow.mapSize.set(2048, 2048); key.shadow.radius = 6; key.shadow.bias = -.0005; key.shadow.normalBias = .02;
  Object.assign(key.shadow.camera, { left: -4, right: 4, top: 4, bottom: -4, near: .5, far: 30 });
  const rim = new THREE.DirectionalLight(0xffc08a, .9); rim.position.set(4, 4, -5);
  const fill = new THREE.DirectionalLight(0xffe2c8, .45); fill.position.set(5, 2, 6);
  sc.add(key, rim, fill, new THREE.HemisphereLight(0xfff4ea, 0xd9b090, .35));
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.ShadowMaterial({ opacity: .22 })); floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; sc.add(floor);
  [key, rim, fill].forEach(l => l.color.convertSRGBToLinear());
  return sc;
}
const lin = sc => sc.traverse(o => { if (!o.material) return; [].concat(o.material).forEach(m => { if (m.__lin || m.isShaderMaterial || m.isShadowMaterial) return; m.__lin = 1;
  if (m.color) m.color.convertSRGBToLinear(); if (m.emissive) m.emissive.convertSRGBToLinear(); if (m.sheenColor) m.sheenColor.convertSRGBToLinear(); }); });

const CAST = [
  { name: 'DOUG', sub: 'the confident everyman · mustard hoodie · navy jeans · white sneakers', o: { outfit: 'hoodie' } },
  { name: 'GARY', sub: 'the observer · light-blue oxford · khakis · brown shoes · glasses', o: { outfit: 'oxford' } },
  { name: 'VICTOR', sub: 'the rich guy / boss · navy suit · red tie · gold watch', o: { outfit: 'suit' } },
  { name: 'POLO GUY', sub: 'the worker · polo · khakis · gray sneakers', o: { outfit: 'polo' } },
  { name: 'THE PRESIDENT', sub: 'head of state · black bomber · white tee · backwards cap · sash', o: { outfit: 'president' } },
  { name: 'GANG MEMBER', sub: 'street crew (never armed) · dark hoodie · beanie · bandana', o: { outfit: 'gang' } },
  { name: 'CHAPO ISIDRO', sub: 'real person · navy cap · plaid western shirt · dark jeans · silver buckle · boots', o: { outfit: 'isidro' },
    gest: ['point', 'cuffed', 'shrug', 'cross', 'think', 'facepalm', 'hips', 'tada'] },
];
const GEST = ['point', 'wave', 'shrug', 'cross', 'think', 'facepalm', 'hips', 'tada'];
const FACES = ['smile', 'happy', 'surprised', 'scream', 'smirk', 'worried', 'flat'];
const labels = document.getElementById('labels');
function label(txt, x, y, w = 200) { const d = document.createElement('div'); d.className = 'l'; d.textContent = txt; d.style.left = (x - w / 2) + 'px'; d.style.top = y + 'px'; d.style.width = w + 'px'; labels.appendChild(d); }
// render a scene into a viewport rect (y from top, in CSS px)
function view(sc, cam, x, y, w, h) { renderer.setViewport(x, H - y - h, w, h); renderer.setScissor(x, H - y - h, w, h); renderer.setScissorTest(true); cam.aspect = w / h; cam.updateProjectionMatrix(); renderer.render(sc, cam); }
function one(o, setup) { const sc = studio(), ch = CHAR.make(Object.assign({ envMap: env }, o)); sc.add(ch.root); setup(ch); lin(sc); return sc; }

function sheet(i) {
  labels.innerHTML = ''; const c = CAST[i]; document.getElementById('t').textContent = c.name; document.getElementById('s').textContent = c.sub;
  renderer.setScissorTest(false); renderer.setViewport(0, 0, W, H); renderer.setClearColor(BG); renderer.clear();
  const cam = new THREE.PerspectiveCamera(24, 1, .1, 100);
  // row 1: turnaround
  [['FRONT', 0], ['3/4', -.75], ['SIDE', -Math.PI / 2], ['BACK', Math.PI]].forEach(([n, ry], k) => {
    const sc = one(c.o, ch => { ch.root.rotation.y = ry; ch.face('smile'); ch.pose({ t: 1 }); });
    cam.fov = 24; cam.position.set(0, 1.35, 7.4); cam.lookAt(0, 1.18, 0); view(sc, cam, 20 + k * 262, 190, 250, 640); label(n, 20 + k * 262 + 125, 800); });
  // row 2: gestures
  (c.gest || GEST).forEach((g, k) => { const col = k % 4, row = (k / 4) | 0;
    const sc = one(c.o, ch => { ch.root.rotation.y = -.2; ch.face(g === 'facepalm' ? 'worried' : g === 'tada' || g === 'wave' ? 'happy' : g === 'cross' ? 'smirk' : 'smile'); ch.pose({ t: 1.3, gesture: g, gw: 1, cuffs: g === 'cuffed' }); });
    cam.fov = 26; cam.position.set(0, 1.3, 7.2); cam.lookAt(0, 1.2, 0); view(sc, cam, 20 + col * 262, 850 + row * 330, 250, 300); label(g.toUpperCase(), 20 + col * 262 + 125, 850 + row * 330 + 296); });
  // row 3: faces
  FACES.forEach((f, k) => {
    const sc = one(c.o, ch => { ch.face(f); ch.pose({ t: 1 }); });
    cam.fov = 18; cam.position.set(0, 2.05, 3.4); cam.lookAt(0, 1.98, 0); view(sc, cam, 14 + k * 152, 1540, 146, 180); label(f.toUpperCase(), 14 + k * 152 + 73, 1724, 150); });
  return true;
}
function lineup() {
  labels.innerHTML = ''; document.getElementById('t').textContent = 'THE CAST'; document.getElementById('s').textContent = 'engine/characters.js · CHAR.make({outfit})';
  renderer.setScissorTest(false); renderer.setViewport(0, 0, W, H); renderer.setClearColor(BG); renderer.clear();
  const sc = studio(), chs = CAST.map((c, k) => { const ch = CHAR.make(Object.assign({ envMap: env }, c.o)); ch.root.position.set((k - (CAST.length - 1) / 2) * .78, 0, (k % 2) * -.5); ch.root.rotation.y = -.15; ch.face(['smile', 'smirk', 'smirk', 'happy', 'smile', 'flat', 'smirk'][k]); ch.pose({ t: k }); sc.add(ch.root); return ch; });
  lin(sc); const cam = new THREE.PerspectiveCamera(30, 1, .1, 100); cam.fov = 26; cam.position.set(0, 1.5, 19); cam.lookAt(0, 1.2, -.3); view(sc, cam, 0, 200, W, 1500);
  CAST.forEach((c, k) => label(c.name.replace('THE ', '').split(' ')[0], 540 + (k - (CAST.length - 1) / 2) * 150, 1330, 150)); return true;
}
// mugshot portrait (for a wanted poster): render-lab --shot <CAST.length+1>; outfit from ?o= (default isidro)
function portrait() { labels.innerHTML = ''; document.getElementById('t').textContent = ''; document.getElementById('s').textContent = '';
  const bg = new THREE.Color(0xc9ccd2).convertSRGBToLinear(); renderer.setScissorTest(false); renderer.setViewport(0, 0, W, H); renderer.setClearColor(bg); renderer.clear();
  const sc = one({ outfit: new URLSearchParams(location.search).get('o') || 'isidro' }, ch => { ch.face('flat'); ch.pose({ t: 1 }); }); sc.background = bg;
  const cam = new THREE.PerspectiveCamera(16, 1, .1, 100); cam.position.set(0, 1.85, 4.6); cam.lookAt(0, 1.78, 0); view(sc, cam, 0, 0, W, H); return true; }
// role hats + held props (Nov 23 2026): render-lab --shot <CAST.length+2>
function roles() { labels.innerHTML = ''; document.getElementById('t').textContent = 'ROLES'; document.getElementById('s').textContent = 'CHAR.make({hat, holdR, holdL})';
  renderer.setScissorTest(false); renderer.setViewport(0, 0, W, H); renderer.setClearColor(BG); renderer.clear();
  const R = [['HARD HAT + DRILL', { outfit: 'hoodie', hat: 'hard', holdR: 'drill' }, 'smile', null],
    ['INSPECTOR + CLIPBOARD', { outfit: 'suit', hat: 'inspector', holdL: 'clipboard' }, 'flat', 'point'],
    ['PILOT', { outfit: 'oxford', hat: 'pilot' }, 'smile', 'hips'],
    ['CHEF', { outfit: 'polo', hat: 'chef' }, 'happy', 'tada'],
    ['TOP HAT', { outfit: 'suit', hat: 'top' }, 'smirk', 'cross'],
    ['MAGNIFIER', { outfit: 'oxford', holdR: 'magnifier' }, 'surprised', 'mag']];
  const cam = new THREE.PerspectiveCamera(24, 1, .1, 100);
  R.forEach(([n, o, f, g], k) => { const col = k % 3, row = (k / 3) | 0;
    const sc = one(o, ch => { ch.root.rotation.y = -.35; ch.face(f); ch.pose({ t: 1, gesture: g && g !== 'mag' ? g : undefined, gw: g && g !== 'mag' ? 1 : 0, armR: g === 'mag' ? { raise: .85 } : g ? undefined : { fwd: -1.3 } }); });
    cam.position.set(0, 1.4, 7.0); cam.lookAt(0, 1.22, 0); view(sc, cam, 20 + col * 350, 200 + row * 860, 340, 800); label(n, 20 + col * 350 + 170, 200 + row * 860 + 790, 340); });
  return true; }
// chill looks (Nov 24 2026): render-lab --shot <CAST.length+3>
function chill() { labels.innerHTML = ''; document.getElementById('t').textContent = 'CHILL DOUG + GARY'; document.getElementById('s').textContent = "outfit 'chilldoug' / 'chillgary' · faces chill · zoned · giggle";
  renderer.setScissorTest(false); renderer.setViewport(0, 0, W, H); renderer.setClearColor(BG); renderer.clear();
  const cam = new THREE.PerspectiveCamera(24, 1, .1, 100);
  [['DOUG', 'chilldoug'], ['GARY', 'chillgary']].forEach(([n, of], k) => {
    const sc = one({ outfit: of }, ch => { ch.root.rotation.y = k ? .3 : -.3; ch.face('chill'); ch.pose({ t: 1 + k, gesture: k ? 'shrug' : undefined, gw: k ? .6 : 0 }); });
    cam.fov = 24; cam.position.set(0, 1.3, 6.4); cam.lookAt(0, 1.15, 0); view(sc, cam, 20 + k * 530, 190, 510, 1000); label(n, 20 + k * 530 + 255, 1180, 300);
    ['chill', 'zoned', 'giggle'].forEach((f, j) => { const s2 = one({ outfit: of }, ch => { ch.face(f); ch.pose({ t: 1 }); });
      cam.fov = 18; cam.position.set(0, 2.1, 3.6); cam.lookAt(0, 2.0, 0); view(s2, cam, 20 + k * 530 + j * 172, 1260, 166, 240); label(f.toUpperCase(), 20 + k * 530 + j * 172 + 83, 1500, 166); }); });
  return true; }
window.SHOT_COUNT = CAST.length + 4;
window.renderShot = i => i < CAST.length ? sheet(i) : i === CAST.length ? lineup() : i === CAST.length + 1 ? portrait() : i === CAST.length + 2 ? roles() : chill();
window.ready = true;
</script></body></html>
