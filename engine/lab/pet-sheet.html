<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Pet character sheet</title>
<!-- Character sheet for the 3D pets (CHAR.make({outfit:'dog'|'cat'})). Render: node engine/lab/render-sheet.js dog|cat <out.jpg> -->
<style>
@font-face{font-family:IN;font-weight:900;src:url('../../node_modules/@fontsource/inter/files/inter-latin-900-normal.woff2')}
@font-face{font-family:IN;font-weight:600;src:url('../../node_modules/@fontsource/inter/files/inter-latin-600-normal.woff2')}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1620px;height:2340px;overflow:hidden;font-family:IN,sans-serif;
  background:linear-gradient(#f3efe6,#e4ddd0)}
#c{position:fixed;left:0;top:0;width:1620px;height:2340px}
.cell{position:fixed;width:405px;height:405px;border:2px solid rgba(60,50,40,.12)}
.lab{position:fixed;width:405px;text-align:center;font-weight:600;font-size:24px;color:#3b3229;letter-spacing:.04em}
.row{position:fixed;left:24px;font-weight:900;font-size:20px;color:#9a8b78;letter-spacing:.18em}
#hd{position:fixed;left:40px;top:34px;font-weight:900;font-size:64px;color:#2b241d}
#sub{position:fixed;left:44px;top:118px;font-weight:600;font-size:24px;color:#6f6252;width:1540px;line-height:1.4}
#sw{position:fixed;right:40px;top:44px;display:flex;gap:14px}
#sw div{width:54px;height:54px;border-radius:50%;border:3px solid rgba(0,0,0,.15)}
</style></head><body>
<canvas id="c"></canvas><div id="hd"></div><div id="sub"></div><div id="sw"></div>
<script src="../../node_modules/three/build/three.min.js"></script>
<script src="../../node_modules/three/examples/js/environments/RoomEnvironment.js"></script>
<script src="../characters.js"></script>
<script>
const W = 1620, H = 2340, TOP = 300, CS = 405;
const KIND = new URLSearchParams(location.search).get('pet') || 'dog', dog = KIND === 'dog';
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true, alpha: true });
renderer.setPixelRatio(1); renderer.setSize(W, H, false); renderer.autoClear = false; renderer.setClearColor(0x000000, 0);
renderer.outputEncoding = THREE.sRGBEncoding; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const env = new THREE.PMREMGenerator(renderer).fromScene(new THREE.RoomEnvironment(), .04).texture;
const scene = new THREE.Scene(), camera = new THREE.PerspectiveCamera(26, 1, .05, 100);
const catcher = new THREE.Mesh(new THREE.PlaneGeometry(40, 40).rotateX(-Math.PI / 2), new THREE.ShadowMaterial({ opacity: .28 })); catcher.receiveShadow = true; scene.add(catcher);
const key = new THREE.DirectionalLight(0xfff1dd, 2.0); key.position.set(-4, 7, 5); key.castShadow = true; key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -3, right: 3, top: 3, bottom: -3, near: .5, far: 30 }); key.shadow.bias = -.0005; key.shadow.normalBias = .02; key.shadow.radius = 4;
const fill = new THREE.DirectionalLight(0xc9d6ff, .9); fill.position.set(5, 3, 6);
const rim = new THREE.DirectionalLight(0xffffff, .7); rim.position.set(2, 4, -6);
scene.add(key, key.target, fill, rim, new THREE.HemisphereLight(0xfff8ee, 0xb8a58a, .55));
const lin = m => { if (m.__lin) return; m.__lin = 1; if (m.color) m.color.convertSRGBToLinear(); };
const pet = CHAR.make({ outfit: KIND, envMap: env }); scene.add(pet.root);
const doug = CHAR.make({ outfit: 'hoodie', envMap: env }); scene.add(doug.root);
scene.traverse(o => o.material && [].concat(o.material).forEach(lin));

const NAME = dog ? 'DOG' : 'CAT';
document.getElementById('hd').textContent = NAME + ' · character sheet';
document.getElementById('sub').textContent = dog
  ? 'CHAR.make({outfit:\'dog\'}) · golden plush body, glossy head with drawn face, cream muzzle + blaze, floppy brown ears, 3D black nose, red collar + gold tag, fast wag. Silent: acts with face, ears, tail, sit / lie / paw / beg / bow.'
  : 'CHAR.make({outfit:\'cat\'}) · blue-gray tabby: plush body, glossy head with drawn face, white muzzle, chest and socks, forehead stripes, pink nose, whiskers, pointy ears, ringed tail, teal collar + gold bell. Slow tail sway. Acts with face, ears, tail, sit / loaf / paw / bow / arch.';
const SW = dog ? ['#bd7c33', '#f5e2bf', '#7a4520', '#c0182e', '#d4a83a'] : ['#727a88', '#f4f4f6', '#474d59', '#f2a2b4', '#16a596', '#e0b440'];
SW.forEach(c => { const d = document.createElement('div'); d.style.background = c; document.getElementById('sw').appendChild(d); });

const box = new THREE.Box3(), v = new THREE.Vector3();
function frameObjects(objs, ry = 0, pad = 1.18, elev = .18) {
  box.makeEmpty(); objs.forEach(o => box.expandByObject(o)); const c = box.getCenter(new THREE.Vector3()), s = box.getSize(new THREE.Vector3());
  const r = Math.max(s.x, s.y, s.z) * .5 * pad, d = r / Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  camera.position.set(c.x + Math.sin(ry) * d * Math.cos(elev), c.y + Math.sin(elev) * d, c.z + Math.cos(ry) * d * Math.cos(elev)); camera.lookAt(c);
}
function frameHead(ry = 0) {
  pet.head.getWorldPosition(v); const r = pet.B.R * 2.0, d = r / Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  camera.position.set(v.x + Math.sin(ry) * d, v.y + .04, v.z + Math.cos(ry) * d); camera.lookAt(v.x, v.y + pet.B.R * .15, v.z);
}
const T = 1.3;
const base = { t: T };
const cells = [];
const add = (row, col, label, fn, span = 1) => cells.push({ row, col, label, fn, span });
// row 0: turnaround
[['FRONT', 0], ['3/4', -.75], ['SIDE', -Math.PI / 2], ['BACK', Math.PI]].forEach(([l, ry], i) => add(0, i, l, () => { pet.face('smile'); pet.pose(base); pet.root.rotation.y = ry; frameObjects([pet.root]); }));
// rows 1-2: faces
['smile', 'happy', 'surprised', 'smirk', 'worried', 'flat', 'blink', 'sleepy'].forEach((f, i) => add(1 + (i >> 2), i % 4, f, () => { pet.face(f); pet.pose({ t: T }); pet.root.rotation.y = -.35; frameHead(-.35); }));
// row 3: poses
add(3, 0, 'walk', () => { pet.face('happy'); pet.pose({ t: T, walk: .22, walkAmt: 1, wag: 1 }); pet.root.rotation.y = -1.0; frameObjects([pet.root]); });
add(3, 1, 'sit', () => { pet.face('smile'); pet.pose({ t: T, sit: 1 }); pet.root.rotation.y = -.7; frameObjects([pet.root]); });
add(3, 2, dog ? 'lie' : 'lie (loaf)', () => { pet.face(dog ? 'smile' : 'sleepy'); pet.pose({ t: T, lie: 1 }); pet.root.rotation.y = -.7; frameObjects([pet.root]); });
add(3, 3, 'gesture: paw', () => { pet.face('happy'); pet.pose({ t: T, gesture: 'paw' }); pet.root.rotation.y = -.5; frameObjects([pet.root]); });
// row 4: special gestures + scale
if (dog) add(4, 0, 'gesture: beg', () => { pet.face('happy'); pet.pose({ t: T, gesture: 'beg', wag: 1 }); pet.root.rotation.y = -.7; frameObjects([pet.root]); });
else add(4, 0, 'gesture: arch', () => { pet.face('surprised'); pet.pose({ t: T, gesture: 'arch' }); pet.root.rotation.y = -1.25; frameObjects([pet.root]); });
add(4, 1, dog ? 'gesture: bow' : 'gesture: bow (stretch)', () => { pet.face(dog ? 'happy' : 'sleepy'); pet.pose({ t: T, gesture: 'bow', wag: 1 }); pet.root.rotation.y = -1.05; frameObjects([pet.root]); });
add(4, 2, 'scale: with Doug', () => { pet.face('smile'); pet.pose({ t: T, sit: dog ? 0 : 1 }); pet.root.rotation.y = -.5; pet.root.position.set(.55, 0, .25);
  doug.root.visible = true; doug.root.position.set(-.45, 0, 0); doug.root.rotation.y = .35; doug.face('smile'); doug.pose({ t: T, look: .35, nod: .25 }); frameObjects([pet.root, doug.root], 0, 1.02, .08); }, 2);

window.ready = false;
function draw() {
  renderer.setScissorTest(false); renderer.clear();
  for (const c of cells) {
    pet.root.position.set(0, 0, 0); pet.root.rotation.set(0, 0, 0); doug.root.visible = false;
    const w = CS * c.span, x = c.col * CS, y = TOP + c.row * CS;
    camera.aspect = w / CS; camera.fov = c.span > 1 ? 22 : 26; camera.updateProjectionMatrix();
    c.fn();
    key.target.position.copy(pet.root.position); key.position.set(pet.root.position.x - 4, 7, pet.root.position.z + 5);
    renderer.setViewport(x, H - y - CS, w, CS); renderer.setScissor(x, H - y - CS, w, CS); renderer.setScissorTest(true);
    renderer.render(scene, camera);
    const cell = document.createElement('div'); cell.className = 'cell'; Object.assign(cell.style, { left: x + 'px', top: y + 'px', width: w + 'px' }); document.body.appendChild(cell);
    const lab = document.createElement('div'); lab.className = 'lab'; lab.textContent = c.label.toUpperCase(); Object.assign(lab.style, { left: x + 'px', top: (y + CS - 40) + 'px', width: w + 'px' }); document.body.appendChild(lab);
  }
  [['TURNAROUND', 0], ['FACES', 1], ['', 2], ['POSES', 3], ['GESTURES', 4]].forEach(([l, r]) => { if (!l) return; const d = document.createElement('div'); d.className = 'row'; d.textContent = l; d.style.top = (TOP + r * CS + 14) + 'px'; document.body.appendChild(d); });
}
document.fonts.ready.then(() => { draw(); window.ready = true; });
</script></body></html>
